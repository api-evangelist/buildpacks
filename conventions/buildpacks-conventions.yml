      x-runtime, strict-transport-security, etag, cache-control, vary).
  cross_reference: rate-limits/buildpacks-rate-limits.yml
request_tracing:
  registry_api:
    header: x-request-id
    example_observed: 609d67d4-9146-aabc-2e01-361de8710359
    also: 'x-runtime (server processing seconds), reporting-endpoints / NEL (Heroku network error logging)'
    documented: false
    note: Emitted by the Heroku router; not documented by the project, but usable for support correlation.
caching:
  registry_api:
    etag: true
    example: 'ETag: W/"c34ead09956aac7ea909e6c7395cf1eb" on GET /api/v1/search'
    cache_control_200: max-age=0, private, must-revalidate
    cache_control_404: no-cache
    vary: Accept, Origin
    conditional_requests: >-
      A weak ETag is returned, so If-None-Match revalidation is available even though it is undocumented.
transport_security:
  hsts: 'max-age=31556952; includeSubDomains; preload (observed on registry.buildpacks.io)'
  cross_reference: security/buildpacks-domain-security.yml
metadata_and_expansion:
  registry_api: none
  kpack: 'standard Kubernetes metadata.labels / metadata.annotations on every resource'
