- aid: buildpacks:platform-api
  name: Platform API Specification
  description: The Platform API is the contract between the CNB lifecycle and a platform such as pack,
    kpack, or a CI runner. It defines how builders, stacks, run images, and inputs are passed to the lifecycle
    phases (analyze, detect, restore, build, export, and rebase) and how outputs are consumed.
  humanURL: https://buildpacks.io/docs/reference/spec/platform-api/
