  name: Buildpack API Specification
  description: The Buildpack API is the contract between a buildpack and the lifecycle. It defines the
    detect and build executables, layers, build-plan provisions and requirements, and image extension
    lifecycle that buildpack authors implement to participate in a CNB build.
