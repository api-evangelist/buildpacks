aid: buildpacks
name: Cloud Native Buildpacks
description: 'Cloud Native Buildpacks (CNBs) transform application source code into OCI-compliant container
  images that can run on any cloud, without requiring Dockerfiles. Initiated by Pivotal and Heroku in
  January 2018, CNB joined the CNCF as a Sandbox project in October 2018 and GRADUATED on 11 August 2026,
  the foundation''s highest maturity tier. It is licensed Apache-2.0. CNB is primarily a specification
  project: three independently versioned contracts — Buildpack API 0.12, Platform API 0.15 and Distribution
  API 0.3 — plus reference implementations (the pack CLI and the lifecycle). It centralizes container
  expertise through composable buildpacks, enables layer rebasing for efficient OS updates, and generates
  Software Bills of Materials in CycloneDX, SPDX and Syft formats. The pack CLI, the kpack Kubernetes
  operator and the public Buildpack Registry API are the primary integration points.'
