description: >-
  Cloud Native Buildpacks publishes no plans and no pricing, because there is nothing to buy.
  It is an Apache-2.0 licensed CNCF Graduated project: you self-host the lifecycle, run the pack CLI
  on your own machine, and operate kpack in your own cluster. The single hosted service — the
  Buildpack Registry at registry.buildpacks.io — is free, anonymous and read-only, with no account,
  no API key and no quota. plan_count is 0 as a measured fact, not as a missing lookup.
plans: []
notes:
  - >-
    This file REPLACES a scaffold written by the 2026-05-04 bulk sweep which asserted a "Free" tier
    with a fabricated 1,000-requests-per-month quota. No such tier, quota or price is published
    anywhere by this project, and the scaffold values have been removed rather than carried forward.
  - >-
    Commercial products BUILT ON Cloud Native Buildpacks are priced by their vendors (Heroku,
    Google Cloud Buildpacks, Salesforce, and others). Those are not this provider's plans and are
    deliberately not recorded here.
  - >-
    Costs of running CNB are infrastructure costs — compute for builds and storage in your own OCI
    registry — and are paid to your cloud provider, not to the project.
license:
  name: Apache-2.0
  url: https://github.com/buildpacks/spec/blob/main/LICENSE
