provider: Cloud Native Buildpacks
providerId: buildpacks
description: >-
  First-party distribution surface for Cloud Native Buildpacks. CNB is a specification project,
  so its "SDKs" are Go modules that implement the Buildpack and Platform APIs (libcnb, lifecycle,
  imgutil), plus the reference pack CLI which is distributed as a Go module, a Homebrew formula,
  a Docker image and OS packages. Every version/published pair below was read from the registry's
  own metadata endpoint on 2026-09-05.
note: >-
  Third-party language bindings exist and are widely used (notably Heroku's Rust libcnb.rs,
  crates.io/crates/libcnb) but are NOT maintained by the Cloud Native Buildpacks project and are
  deliberately excluded from this first-party inventory.
