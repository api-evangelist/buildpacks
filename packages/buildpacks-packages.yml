os_packages:
- manager: apt
  target: Ubuntu
  install: sudo add-apt-repository ppa:cncf-buildpacks/pack-cli && sudo apt-get update && sudo apt-get install pack-cli
- manager: dnf
  target: Fedora
  install: sudo dnf install pack
- manager: pacman
  target: Arch Linux
  install: pacman -S pack-cli
- manager: zypper
  target: openSUSE
  install: sudo zypper refresh && sudo zypper install buildpacks-cli
- manager: chocolatey
  target: Windows
  install: choco install pack --version=0.40.9
- manager: scoop
  target: Windows
  install: scoop install pack
- manager: mise
  target: cross-platform
  install: mise use -g pack@latest
docs: https://buildpacks.io/docs/for-platform-operators/how-to/integrate-ci/pack/
