description: >-
  Versioning, deprecation and release governance for the Cloud Native Buildpacks specifications and
  their reference implementations. CNB versions THREE independent API contracts on separate tracks,
  each with its own release milestones and its own Deprecations section in the spec text.
versioning:
  scheme: major.minor
  in: contract-declared API version (not a URL path or header)
  rule: >-
    "API versions MUST be in form <major>.<minor> or <major>, where <major> is equivalent to
    <major>.0. When <major> is greater than 0 increments to <minor> SHALL exclusively indicate
    additive changes." — https://github.com/buildpacks/spec/blob/main/distribution.md
  note: >-
    All three APIs remain on major version 0, so minor increments are NOT guaranteed additive today;
    that guarantee attaches at 1.0.
  current:
  - api: Buildpack API
    version: '0.12'
    released: '2025-12-11'
    release: https://github.com/buildpacks/spec/releases/tag/buildpack%2F0.12
  - api: Platform API
    version: '0.15'
    released: '2025-12-11'
    release: https://github.com/buildpacks/spec/releases/tag/platform%2F0.15
  - api: Distribution API
    version: '0.3'
    released: null
    note: Declared in distribution.md; not cut as a standalone GitHub release.
  - api: kpack CRD API
    version: v1alpha1
    note: >-
      Kubernetes alpha API version. Per Kubernetes convention an alpha group/version may change
      incompatibly and may be dropped; kpack has nonetheless served v1alpha1 since its first release.
release_process:
  documented: true
  url: https://github.com/buildpacks/spec/blob/main/RELEASE.md
  summary: >-
    A maintainer opens a milestone, cuts a `<spec>/<version>` release branch, and spec changes must
    be approved by a super-majority of the core team before the release PR merges. Release planning
    is reviewed at the weekly core team sync.
  governance: https://github.com/buildpacks/community#core-team
deprecation_policy:
  documented: true
  mechanism: >-
    Each specification carries a normative "Deprecations" section naming every deprecated feature and
    the exact API version in which it was deprecated, with a migration path. There is no HTTP
    Sunset/Deprecation header surface, because these are file-format and process contracts rather
    than a hosted HTTP API.
  urls:
  - https://github.com/buildpacks/spec/blob/main/buildpack.md#deprecations
  - https://github.com/buildpacks/spec/blob/main/platform.md#deprecations
  examples:
  - feature: buildpack.toml `stacks` array
    deprecated_in: Buildpack API 0.10
  - feature: positional arguments to the `detect` and `build` executables
    deprecated_in: Buildpack API 0.8
  - feature: buildpack.toml `bom` array
    deprecated_in: Buildpack API 0.7
  - feature: the `stack` key / stack concept
    deprecated_in: Platform API 0.12
  - feature: '`-image` flag on the lifecycle rebase phase'
    deprecated_in: Platform API (marked Deprecated in platform.md)
