provider: Cloud Native Buildpacks
providerId: buildpacks
description: >-
  Cloud Native Buildpacks publishes no single prose changelog. Change is announced through dated
  GitHub Releases on four independent tracks — the specification repo (which cuts one release per
  API version), and the pack, lifecycle and kpack implementations. The spec track is the one that
  represents a contract change for integrators.
scheme: major.minor per API, cut as a tagged GitHub Release
