gaps:
- >-
  No aggregate project changelog and no RSS/Atom feed of releases is advertised on buildpacks.io.
  An integrator has to watch four repositories independently.
- >-
  GitHub release notes for the spec tracks do not carry a machine-readable breaking-vs-additive flag;
  the Deprecations sections in buildpack.md and platform.md are the authoritative record.
