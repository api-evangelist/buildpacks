  update:
    description: >-
      kpack is the Kubernetes-native Cloud Native Buildpacks build service, maintained in the
      buildpacks-community GitHub organization alongside the CNCF Cloud Native Buildpacks project.
      This document describes the kpack.io/v1alpha1 CustomResourceDefinition API served by the
      operator's own Kubernetes API server; there is no buildpacks.io-hosted endpoint.
