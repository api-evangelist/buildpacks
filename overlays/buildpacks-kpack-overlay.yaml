- target: $.info
  description: Record the contract gaps measured against the served API.
  update:
    x-contract-gaps:
    - id: no-security-definitions
      detail: >-
        The document declares no securityDefinitions, yet all 67 operations declare a 401
        Unauthorized response. Authentication is real and is enforced by the Kubernetes API server;
        it is simply not modelled. See authentication/buildpacks-authentication.yml.
    - id: v1alpha2-schemas-without-paths
      detail: >-
        definitions carries both kpack.build.v1alpha1.* and kpack.build.v1alpha2.* schemas, but
        every path is rooted at /apis/kpack.io/v1alpha1/. Buildpack, ClusterBuildpack,
        ClusterLifecycle and the Cosign/cache types exist as schemas with no operations.
    - id: undocumented-error-responses
      detail: >-
        Only 200/201/401 are modelled. 403, 404, 409 and 422 are all reachable and all absent.
        See errors/buildpacks-problem-types.yml.
    - id: dry-run-not-declared
      detail: >-
        The Kubernetes dryRun=All query parameter works against these endpoints but is not declared,
        so an agent reading only this contract cannot discover rehearsal.
- target: $.info
  description: Point at the derived artifacts built from this document.
  update:
    x-api-evangelist-artifacts:
      authentication: authentication/buildpacks-authentication.yml
      conventions: conventions/buildpacks-conventions.yml
      data_model: data-model/buildpacks-data-model.yml
      errors: errors/buildpacks-problem-types.yml
