provider: Cloud Native Buildpacks
providerId: buildpacks
description: >-
  Cloud Native Buildpacks exposes three distinct authentication postures, none of them an
  API-key or OAuth program run by the project itself. Read access to the Buildpack Registry is fully
  anonymous; write access to the registry is delegated to GitHub identity; and the kpack CRD API
  inherits whatever the Kubernetes API server enforces. The kpack Swagger document declares no
  `securityDefinitions`, which is normal for a Kubernetes aggregated/CRD spec and is NOT an absence
  of auth — the cluster enforces it.
docs: https://buildpacks.io/docs/for-buildpack-authors/how-to/distribute-buildpacks/publish-buildpack/
